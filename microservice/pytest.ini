[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_scope = function
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    asyncio: marca tests como asyncio (desacopla de dependencias de pytest-asyncio)
    slow: marca tests como lentos
    integration: marca como pruebas de integración
    mongodb: requiere MongoDB disponible
